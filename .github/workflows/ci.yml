name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "release/**"
      - "hotfix/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e ".[desktop]"

      - name: Run shipped-default Qt Quick tests
        env:
          QT_QPA_PLATFORM: offscreen
          QSG_RHI_BACKEND: software
          QT_QUICK_CONTROLS_STYLE: Basic
        run: >-
          python -m unittest
          tests.test_cli.TestCLI.test_frozen_exe_entry_defaults_to_qt_quick_dashboard_when_double_clicked
          tests.test_qt_quick_core
          tests.test_qt_quick_capabilities
          tests.test_qt_quick_presenters
          tests.test_qt_quick_host
          tests.test_qt_quick_grafiks
          tests.test_qt_quick_preview
          tests.test_qt_quick_benchmark
          tests.test_qml_format
          -v

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run demo-good
        run: python -m sg_preflight demo-good --fail-on error

      - name: Run demo-broken
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ge 7) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          python -m sg_preflight demo-broken --fail-on error
          if ($LASTEXITCODE -ne 2) {
            throw "demo-broken returned exit code $LASTEXITCODE instead of 2"
          }
          exit 0
